name: Haybarn Rust CI

# CI for the Haybarn 2.0 line (branch haybarn-2.0, crates 1.20000.x). Covers both
# supported paths on Linux, macOS and Windows:
#   - bundled: compiles the vendored Haybarn sources (crates/libduckdb-sys/duckdb.tar.gz),
#     which carry the Haybarn extension trust root;
#   - linked: downloads the libhaybarn-<platform>.zip pinned in
#     crates/libduckdb-sys/.duckdb-release from the Haybarn GitHub release.
# Nothing here publishes; crates.io publishing lives in haybarn-rust.yml.

on:
  push:
    branches: ["haybarn-2.0"]
  pull_request:
    branches: ["haybarn-2.0"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint + trust root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

      - name: Verify the bundled sources carry the Haybarn trust root and a release version
        run: |
          set -euo pipefail
          tar xzf crates/libduckdb-sys/duckdb.tar.gz -O duckdb/src/main/extension/extension_helper.cpp \
            | grep -q HAYBARN_TRUST_ROOT \
            || { echo "FAIL: trust root missing from bundled sources"; exit 1; }
          version=$(tar xzf crates/libduckdb-sys/duckdb.tar.gz -O duckdb/src/function/table/version/pragma_version.cpp \
            | sed -n 's/^#define DUCKDB_VERSION "\(.*\)"$/\1/p')
          echo "bundled DUCKDB_VERSION=$version"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "FAIL: not a release version"; exit 1; }

      - name: Verify the release pin points at Haybarn
        run: |
          grep -qx 'DUCKDB_RELEASE_URL=https://github.com/Query-farm-haybarn/haybarn/releases/download/.*' \
            crates/libduckdb-sys/.duckdb-release \
            || { echo "FAIL: .duckdb-release must point at a Haybarn release"; exit 1; }

  bundled:
    name: bundled — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        include:
          # aarch64 Linux links with GNU ld (no rust-lld default), which is what
          # caught the static-extension link order. test_invalid_unicode_file_names
          # also fails there on upstream duckdb-rs v1.20000.0 (bundled, aarch64):
          # "invalid lead byte detected in Utf8Proc::UTF8ToCodepoint".
          - os: ubuntu-24.04-arm
            test_args: "-- --skip test_invalid_unicode_file_names"
    env:
      # cc-rs also wraps the C++ engine compile when RUSTC_WRAPPER is sccache.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      # bundled uses the committed duckdb.tar.gz; the engine submodule is not needed.
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
      - uses: mozilla-actions/sccache-action@v0.0.10

      # Proves the bundled engine links and executes, and reports a release version.
      - name: Smoke query
        run: cargo run -p haybarn --features bundled --example haybarn_smoke --locked

      # One invocation, so both crates share a single libhaybarn-sys (and engine) build.
      - name: Test haybarn + haybarn-neo
        run: >-
          cargo test -p haybarn -p haybarn-neo --locked
          --features "haybarn/bundled haybarn/extensions-full haybarn/modern-full haybarn/vscalar
          haybarn/vtab-full haybarn-neo/bundled haybarn-neo/chrono haybarn-neo/uuid haybarn-neo/r2d2
          haybarn-neo/rust_decimal" ${{ matrix.test_args }}

      - name: Test libhaybarn-sys
        run: cargo test -p libhaybarn-sys --features bundled --locked

      - name: Test haybarn-loadable-macros
        run: cargo test -p haybarn-loadable-macros --features neo --locked

      # Exercises haybarn-loadable-macros, whose generated code must resolve
      # `::haybarn::ffi` / `::haybarn_neo::` (renamed from duckdb / duckdb_neo).
      - name: Build loadable extension examples
        run: |
          cargo build -p haybarn --example hello-ext --features loadable-extension --locked
          cargo build -p haybarn-neo --example 002-extension --features build-extension --locked

  linked:
    name: linked (libhaybarn download) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Explicit for clarity; the pin file makes this the default anyway.
      DUCKDB_DOWNLOAD_LIB: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-on-failure: false
      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Smoke query
        run: cargo run -p haybarn --example haybarn_smoke --locked

      - name: Test haybarn
        run: cargo test -p haybarn --features "modern-full vscalar vtab-full" --locked

      - name: Test haybarn-neo
        run: cargo test -p haybarn-neo --features "chrono uuid r2d2 rust_decimal" --locked

      - name: Test haybarn-neo static extension
        run: cargo test -p haybarn-neo --features build-extension-static --test static_extension --test static_macro_function --locked

      - name: Test libhaybarn-sys
        run: cargo test -p libhaybarn-sys --locked
