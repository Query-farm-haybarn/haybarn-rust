[package]
name = "haybarn-neo"
description = "Ergonomic wrapper for the Haybarn engine's v2 C API (powered by DuckDB; experimental)"
version = "0.20000.0-rc.3"
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = "https://docs.rs/haybarn-neo/"
categories = { workspace = true }
keywords = { workspace = true }
readme = "README.md"
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "haybarn_neo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[features]
default = ["buildtime-download", "buildtime-pkg-config", "buildtime-pregenerated"]
# Features
chrono = ["dep:chrono"]
r2d2 = ["dep:r2d2"]
uuid = ["dep:uuid"]
rust_decimal = ["dep:rust_decimal"]

# Buildtime features
# Where to find a prebuilt libduckdb. Not needed with `bundled`; opt out with `default-features = false`.
buildtime-download = ["libhaybarn-sys/download-lib"]
buildtime-pkg-config = ["libhaybarn-sys/pkg-config"]

# Compatibility marker only; pregenerated bindings are used without `buildtime-bindgen`.
buildtime-pregenerated = []
# Needs libclang and duckdb_v2.h (see DUCKDB_INCLUDE_DIR).
buildtime-bindgen = ["libhaybarn-sys/buildtime_bindgen"]

bundled = ["libhaybarn-sys/bundled"]
bundled-json = ["bundled", "libhaybarn-sys/json"]
bundled-parquet = ["bundled", "libhaybarn-sys/parquet"]

bundled-cmake = ["bundled", "libhaybarn-sys/bundled-cmake"]
# Extensions statically linked through the CMake build backend.
bundled-cmake-autocomplete = ["bundled-cmake", "libhaybarn-sys/autocomplete"]
bundled-cmake-httpfs = ["bundled-cmake", "libhaybarn-sys/httpfs"]
bundled-cmake-icu = ["bundled-cmake", "libhaybarn-sys/icu"]
bundled-cmake-tpcds = ["bundled-cmake", "libhaybarn-sys/tpcds"]
bundled-cmake-tpch = ["bundled-cmake", "libhaybarn-sys/tpch"]

build-extension = ["libhaybarn-sys/loadable-extension-v2"]
build-extension-static = []

[dependencies]
chrono = { workspace = true, optional = true }
haybarn-loadable-macros = { workspace = true, features = ["neo"] }
libhaybarn-sys = { workspace = true, features = ["capi-v2"] }
paste = { workspace = true }
r2d2 = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
tempfile = { workspace = true }

[package.metadata.docs.rs]
features = ["chrono", "r2d2", "rust_decimal", "uuid"]
all-features = false
no-default-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []

[[example]]
name = "002-extension"
crate-type = ["cdylib"]
required-features = ["build-extension"]
